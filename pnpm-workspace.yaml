packages:
  - "apps/*"
  - "examples/basic-traces/typescript"
  - "examples/openinference-openai/typescript"
  - "packages/*"

reporter: silent
autoInstallPeers: false

minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@opentelemetry/*'
  - '@typescript/*'
  - '@duckdb/node-api@1.5.4-r.1'
  - '@duckdb/node-bindings-darwin-arm64@1.5.4-r.1'
  - '@duckdb/node-bindings-darwin-x64@1.5.4-r.1'
  - '@duckdb/node-bindings-linux-arm64-musl@1.5.4-r.1'
  - '@duckdb/node-bindings-linux-arm64@1.5.4-r.1'
  - '@duckdb/node-bindings-linux-x64-musl@1.5.4-r.1'
  - '@duckdb/node-bindings-linux-x64@1.5.4-r.1'
  - '@duckdb/node-bindings-win32-arm64@1.5.4-r.1'
  - '@duckdb/node-bindings-win32-x64@1.5.4-r.1'
  - '@duckdb/node-bindings@1.5.4-r.1'
  - fast-uri@3.1.4
  - find-my-way@9.7.0
  - files-sdk@2.2.2
  - minimatch@10.2.6
  - typescript@7.0.2
  - uuid@11.1.1

overrides:
  'files-sdk@2.2.2>@modelcontextprotocol/sdk': '-'
  '@opentelemetry/core': ^2.9.0
  fast-uri: 3.1.4
  find-my-way: 9.7.0
  'minimatch@9.0.9': 10.2.6
  protobufjs: 7.6.5
  uuid@<11.1.1: ^11.1.1
