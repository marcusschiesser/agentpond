packages:
  - "apps/*"
  - "examples/basic-traces/typescript"
  - "examples/openinference-openai/typescript"
  - "examples/vercel-eve"
  - "packages/*"

reporter: silent
autoInstallPeers: false

minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.29'
  - '@ai-sdk/provider-utils@5.0.13'
  - '@ai-sdk/provider@4.0.4'
  - '@opentelemetry/*'
  - '@typescript/*'
  - '@duckdb/node-api@1.5.4-r.1'
  - '@duckdb/node-bindings-darwin-arm64@1.5.4-r.1'
  - '@duckdb/node-bindings-darwin-x64@1.5.4-r.1'
  - '@duckdb/node-bindings-linux-arm64-musl@1.5.4-r.1'
  - '@duckdb/node-bindings-linux-arm64@1.5.4-r.1'
  - '@duckdb/node-bindings-linux-x64-musl@1.5.4-r.1'
  - '@duckdb/node-bindings-linux-x64@1.5.4-r.1'
  - '@duckdb/node-bindings-win32-arm64@1.5.4-r.1'
  - '@duckdb/node-bindings-win32-x64@1.5.4-r.1'
  - '@duckdb/node-bindings@1.5.4-r.1'
  - brace-expansion@5.0.12
  - fast-uri@3.1.8
  - find-my-way@9.7.0
  - files-sdk@3.1.0
  - ai@7.0.38
  - eve@0.31.0
  - minimatch@10.2.6
  - typescript@7.0.2
  - undici@6.28.1
  - uuid@11.1.1

overrides:
  '@opentelemetry/core': ^2.9.0
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  fast-uri: 3.1.8
  find-my-way: 9.7.0
  'minimatch@9.0.9': 10.2.6
  'image-size@>=1.2.0 <2.0.3': 2.0.3
  '@grpc/grpc-js@>=1.14.0 <1.14.5': 1.14.5
  '@fastify/busboy@>=3.0.0 <3.2.2': 3.2.2
  'undici@>=8.0.0 <8.10.2': 8.10.2
  protobufjs: 7.6.5
  'undici@>=6.0.0 <6.28.1': 6.28.1
  uuid@<11.1.1: ^11.1.1
